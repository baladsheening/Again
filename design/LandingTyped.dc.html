<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@500&display=swap">
  <style>
    :root {
      --bg: #000000;
      --text: #eae6da;
      --muted: color-mix(in srgb, #eae6da 60%, transparent);
      --off: color-mix(in srgb, #eae6da 28%, transparent);
      --rule: #30302b;
      --brass: #b49a62;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Fira Sans', ui-sans-serif, system-ui, sans-serif;
      font-size: 16px;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--text); text-decoration: none; }
    a:hover { color: var(--text); }
    .wordmark {
      font-family: 'Jost', ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1;
    }
    .muted { color: var(--muted); }
    .day {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      line-height: 1.3;
      color: var(--muted);
      margin: 26px 0 10px 0;
    }
    .day:first-child { margin-top: 0; }
    .line {
      font-size: 18px;
      line-height: 28px;
      padding: 8px 0;
      letter-spacing: -0.01em;
    }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #000000; overflow: hidden; display: flex; flex-direction: column;">

    <span class="wordmark" style="font-size: 1.25rem; color: #b49a62;">Again</span>

    <div style="display: flex; align-items: center; gap: 22px;">
      <!-- undo: lit, because a line landed inside the last ten seconds -->
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" style="color: #b49a62; flex-shrink: 0;"><path d="M6.75 4.25 3.25 7.75l3.5 3.5" /><path d="M3.25 7.75h7.75a4.75 4.75 0 0 1 0 9.5H8.25" /></svg>

    </div>
  </div>

  <div style="flex: 1 1 auto; padding: 20px 20px 0 20px;">

    <p class="day">18 August</p>

    <div class="line">moka pot — the 3-cup one</div>
    <div class="line">learn to develop film at home</div>
    <div class="line" style="opacity: 0.5; text-decoration: line-through;">that Georgian place on Cowley Rd</div>
    <div class="line">Aftersun<span class="muted" style="font-size: 13px; margin-left: 8px;">2022</span></div>

    <!--
      A photographed capture, captioned. The image rides the line in the same
      slot the year takes, so a photo never costs the page its rhythm — one
      line is still one line. Tapping it opens the picture full.
    -->
    <p class="day">Today</p>
    <div class="line">poster outside the Ultimate Picture House<span style="display: inline-block; width: 24px; height: 24px; background: #20201d; border: 1px solid #30302b; border-radius: 2px; margin-left: 8px; vertical-align: -6px;"></span></div>

    <!-- the line being written: not a capture until Return -->
    <div class="line" style="display: flex; align-items: center;">
      <span>swim at the ponds before it gets cold</span>
      <span style="display: inline-block; width: 2px; height: 26px; background: #b49a62; margin-left: 1px;"></span>
    </div>

  </div>

  <!-- the caret is mid-line, so nothing is saved to cross off or settle; the camera and search still act -->

    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" style="color: #b49a62; flex-shrink: 0;"><path d="M3 7h3.25l1.25-2h5l1.25 2H17v9.5H3z" /><circle cx="10" cy="11.25" r="3.25" /></svg>

    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" style="color: #b49a62; flex-shrink: 0;"><circle cx="8.75" cy="8.75" r="5.25" /><path d="M12.75 12.75 16.75 16.75" /></svg>
