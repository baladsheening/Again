<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Fira+Sans:wght@400&amp;display=swap">
  <style>
    body { margin: 0; background: #000000; }
    a { color: #ffffff; } a:hover { color: #ffffff; }
    .grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .grain-under { opacity: 0.16; mix-blend-mode: screen; z-index: 1; }
    .grain-over { opacity: 0.30; mix-blend-mode: multiply; z-index: 3; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: lowercase; color: #ffffff; }
    .body { font-family: 'Fira Sans', system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: #ffffff; }
    .anchor { position: absolute; padding: 14px; }
    .caption { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: lowercase; color: #ffffff; }
    .rule { background: #ffffff; height: 1px; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    .caret { animation: blink 1.06s steps(1, end) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.32; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .caret { animation: none; }
    }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #000000; overflow: hidden;">

  <svg class="grain grain-under" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="gu"><feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="4" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
    <rect width="100%" height="100%" filter="url(#gu)"></rect>
  </svg>

  <div style="position: relative; z-index: 2; width: 100%; height: 100%;">

    <div class="anchor" style="top: 30px; left: 8px; font-family: 'Instrument Serif', Georgia, serif; font-size: 19px; color: #ffffff;">keep</div>
    <div class="anchor mono" style="top: 34px; right: 8px;">me</div>

    <div style="position: absolute; top: 285px; left: 0; right: 0; text-align: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 72px; line-height: 0.86; letter-spacing: -0.015em; color: #ffffff;">WRITE<br>IT DOWN.</div>

    <div class="body" style="position: absolute; top: 453px; left: 45px; width: 300px; text-align: center;">anything you want to do, try, watch, buy &mdash; or just remember.</div>

    <div class="rule" style="position: absolute; top: 542px; left: 147px; width: 96px;"></div>

    <div style="position: absolute; bottom: 74px; left: 22px; right: 22px;">
      <div class="caption" style="margin-bottom: 16px; text-align: right;">swipe a line away and it stays out of matching</div>
      <div style="display: flex; align-items: center; gap: 3px; margin-bottom: 9px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.06em; color: #ffffff;">
        <span>write a line</span>
        <span class="caret" style="display: inline-block; width: 2px; height: 15px; background: #ffffff;"></span>
      </div>
      <div class="rule pulse" style="height: 1.5px;"></div>
    </div>

    <div class="anchor mono" style="bottom: 10px; left: 8px;">network</div>
    <div class="anchor mono" style="bottom: 10px; right: 8px;">inbox</div>

  </div>

  <svg class="grain grain-over" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="go"><feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
    <rect width="100%" height="100%" filter="url(#go)"></rect>
  </svg>

</div>
</x-dc>
</body>
</html>
