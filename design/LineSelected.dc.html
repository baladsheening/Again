  <style>
    :root {
      --bg: #000000;
      --text: #eae6da;
      --muted: color-mix(in srgb, #eae6da 60%, transparent);
      --off: color-mix(in srgb, #eae6da 28%, transparent);
      --rule: #30302b;
      --brass: #b49a62;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Fira Sans', ui-sans-serif, system-ui, sans-serif;
      font-size: 16px;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--text); text-decoration: none; }
    a:hover { color: var(--text); }
    .wordmark {
      font-family: 'Jost', ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1;
    }
    .muted { color: var(--muted); }
    .line {
      font-size: 18px;
      line-height: 28px;
      padding: 8px 0;
      letter-spacing: -0.01em;
      position: relative;
    }
    /*
      The mark for the selected line. The caret's own width and colour, sitting
      in the gutter rather than in the text — so it borrows a vocabulary the
      page has already taught without claiming a character position.
    */
    .line.picked::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 26px;
      background: #b49a62;
    }
  </style>
</helmet>
